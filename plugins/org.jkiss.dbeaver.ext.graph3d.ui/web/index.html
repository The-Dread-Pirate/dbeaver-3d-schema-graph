<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DBeaver 3D Schema Graph</title>
  <style>
    /* Theme variables the vendored renderer reads via getComputedStyle.
       Defaults suit a dark IDE; DBeaver can override via injected CSS later. */
    :root {
      --graph-node: #b4b4b4;
      --graph-line: #4a4a4a;
      --interactive-accent: #7c3aed;
      --text-muted: #888888;
      --background-primary: #1e1e1e;
      --background-modifier-border: #3a3a3a;
    }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: var(--background-primary);
      color: #ddd;
      font: 13px system-ui, sans-serif;
      overflow: hidden;
    }
    #graph3d-root { display: flex; height: 100vh; width: 100vw; }
    #graph3d-canvas-host { flex: 1 1 auto; position: relative; min-width: 0; }
    #graph3d-canvas-host canvas { display: block; }
    #graph3d-side {
      flex: 0 0 280px; border-left: 1px solid var(--background-modifier-border);
      padding: .75rem; overflow: auto;
      background: var(--background-primary);
    }
    #graph3d-details:empty::before {
      content: "Select a node to see its columns and keys.";
      opacity: .6;
    }
    #graph3d-status {
      position: absolute; left: .5rem; bottom: .5rem;
      padding: 2px 8px; border-radius: 4px;
      background: rgba(0,0,0,.45); color: #ccc; font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="graph3d-root">
    <div id="graph3d-canvas-host">
      <div id="graph3d-status">Loading…</div>
      <div id="graph3d-debug" style="position:absolute;left:.5rem;top:.5rem;padding:2px 8px;border-radius:4px;background:rgba(0,0,0,.55);color:#9fe;font:11px monospace;pointer-events:none;">dbg: (waiting)</div>
    </div>
    <aside id="graph3d-side">
      <div id="graph3d-details"></div>
    </aside>
  </div>
  <script src="graph3d.bundle.js"></script>
</body>
</html>
